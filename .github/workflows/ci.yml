name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out cometbft-archive
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check vulnerabilities
        run: make vulncheck

      - name: Check formatting
        run: make fmt-check

      - name: Check package loading
        run: go list ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out cometbft-archive
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: make test

  e2e:
    name: Real CometBFT e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out cometbft-archive
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Real CometBFT e2e
        run: make e2e-real-cometbft

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out cometbft-archive
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - name: Check out cometbft-archive
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Race
        run: make race
